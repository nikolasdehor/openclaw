version: '3.8'

services:
  db:
    image: sqlite3
    container_name: life-gamification-db
    volumes:
      - ./data:/data
    command: ["sqlite3", "/data/gamification.db"]
    networks:
      - life-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: life-gamification-api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./backend:/app
    environment:
      - DB_PATH=/app/data/gamification.db
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - life-net
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: life-gamification-frontend
    ports:
      - "3000:80"
    networks:
      - life-net
    depends_on:
      - backend
    restart: unless-stopped

networks:
  life-net:
    driver: bridge
