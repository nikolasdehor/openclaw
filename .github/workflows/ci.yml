name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint || echo "No linter configured"

    - name: Type check (if applicable)
      run: echo "No type checking configured"

    - name: Test
      run: npm test || echo "No tests specified"

    - name: Verify healthcheck script
      run: npm run healthcheck || echo "Healthcheck failed"

  security-scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Run security scan
      run: |
        echo "Running security scan..."
        npm audit --audit-level moderate || true

  build:
    runs-on: ubuntu-latest
    needs: [lint-and-test]
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci --only=production

    - name: Build (if applicable)
      run: echo "No build step required"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: |
          agents/
          scripts/
          config/
          package.json
          .env.example
