name: Deploy to Railway

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci --only=production

    - name: Run tests (optional)
      run: npm test || echo "No tests"

    - name: Deploy to Railway
      uses: railway-app/action@v1.0.4
      with:
        dockerfile: false
        project: ${{ secrets.RAILWAY_PROJECT_ID }}
        service: ${{ secrets.RAILWAY_SERVICE_NAME }}
        token: ${{ secrets.RAILWAY_TOKEN }}
        environment: production
      env:
        NODE_ENV: production
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        WHATSAPP_SESSION_PATH: /data/.openclaw/sessions/whatsapp
        ALERT_PHONE: ${{ secrets.ALERT_PHONE }}
        HEARTBEAT_INTERVAL_MINUTES: 30
        DISK_THRESHOLD_PERCENT: 80
        MEMORY_THRESHOLD_PERCENT: 80
        LOG_LEVEL: info
